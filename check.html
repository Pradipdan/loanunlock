
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        .square {
            width: 100px;
            height: 100px;
            background-color: #f0f0f0;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="game-board">
        <!-- Game board squares -->
        <button class="square" onclick="play(0)">Top Left</button>
        <button class="square" onclick="play(1)">Top Center</button>
        <button class="square" onclick="play(2)">Top Right</button>
        <button class="square" onclick="play(3)" id="middle-left">Middle Left</button>
        <button class="square" onclick="play(4)" id="middle-center">Middle Center</button>
        <button class="square" onclick="play(5)" id="middle-right">Middle Right</button>
        <button class="square" onclick="play(6)" id="bottom-left">Bottom Left</button>
        <button class="square" onclick="play(7)" id="bottom-center">Bottom Center</button>
        <button class="square" onclick="play(8)" id="bottom-right">Bottom Right</button>
    </div>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let playerTurn = true;

        function play(position) {
            if (board[position] === '') {
                board[position] = playerTurn ? 'X' : 'O';
                document.querySelector(`button#middle-left`).innerHTML = board[3];
                document.querySelector(`button#middle-center`).innerHTML = board[4];
                document.querySelector(`button#middle-right`).innerHTML = board[5];
                document.querySelector(`button#bottom-left`).innerHTML = board[6];
                document.querySelector(`button#bottom-center`).innerHTML = board[7];
                document.querySelector(`button#bottom-right`).innerHTML = board[8];

                checkWin();
                playerTurn = !playerTurn;
            }
        }

        function checkWin() {
            const winningCombinations = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            for (let i = 0; i < winningCombinations.length; i++) {
                const [a, b, c] = winningCombinations[i];
                if (board[a] !== '' && board[b] !== '' && board[c] === board[a]) {
                    alert(`Player ${board[a]} wins!`);
                    resetGame();
                    return;
                }
            }

            let emptySquares = 0;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') emptySquares++;
            }
            if (emptySquares === 0) alert('It\'s a draw!');
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            document.querySelectorAll('.square').forEach((square) => {
                square.innerHTML = '';
            });
            playerTurn = true;
        }
    </script>
</body>
</html>
